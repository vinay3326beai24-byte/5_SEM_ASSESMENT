<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>
    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: rgb(164, 23, 112);
    border-top: 6px solid #222;
}

.container {
    width: 610px;
    margin-left: 110px;
    padding: 42px 22px 20px 22px;
}

h1 {
    font-size: 29px;
    margin: 0 0 22px 0;
}

label {
    display: block;
    font-size: 17px;
    margin-bottom: 6px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #aaaaaa;
    font-family: Arial, sans-serif;
    font-size: 16px;
    padding: 8px 11px;
}

input,
select {
    height: 39px;
}

textarea {
    height: 55px;
    resize: both;
}

.error {
    color: red;
    font-size: 16px;
    min-height: 18px;
    margin: 3px 0 10px 0;
}

.buttons {
    margin-top: 55px;
    display: flex;
    gap: 5px;
}

button {
    background-color: #661ed1;
    border: 1px solid #aaa;
    border-radius: 3px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background-color: #ddd;
}

h2 {
    font-size: 21px;
    margin-top: 20px;
    margin-bottom: 24px;
}

.stored-heading {
    font-size: 28px;
    margin-bottom: 24px;
}

.stored-feedback {
    border: 1px solid #aaa;
    padding: 12px;
    font-size: 16px;
    min-height: 45px;
    line-height: 1.6;
}
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Feedback Form</h1>

        <form id="feedbackForm">

            
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="">
            <div class="error" id="nameError"></div>

            
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="">
            <div class="error" id="emailError"></div>

            
            <label for="course">Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="CSE">Computer Science</option>
                <option value="AI">Artificial Intelligence</option>
                <option value="DS">Data Science</option>
                <option value="Cyber Security">Cyber Security</option>
            </select>
            <div class="error" id="courseError"></div>

            
            <label for="feedback">Feedback</label>
            <textarea id="feedback"></textarea>
            <div class="error" id="feedbackError"></div>

            
            <div class="buttons">
                <button type="submit">Submit Feedback</button>
                <button type="button" id="deleteBtn">Delete Stored Data</button>
            </div>

        </form>

        
        <h2 id="sessionUser">Current Session User:</h2>

       
        <h1 class="stored-heading">Stored Feedback</h1>

        <div class="stored-feedback" id="storedFeedback">
            No feedback stored.
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
